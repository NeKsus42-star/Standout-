name: build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Prepare Gradle project
        run: |
          unzip -q jojostands-mod.zip
          sed -i "s#net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT#com.anatawa12.forge:ForgeGradle:2.3-1.0.+#" jojostands/build.gradle
          sed -i "s#jcenter()#mavenCentral()#g" jojostands/build.gradle
          sed -i "s#1.12.2-14.23.5.2860#1.12.2-14.23.5.2847#" jojostands/build.gradle
          curl -L --fail -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-mdk.zip
          unzip -q mdk.zip -d mdk
          cp -r mdk/gradle mdk/gradlew jojostands/
          chmod +x jojostands/gradlew

      - name: Build JAR
        working-directory: jojostands
        run: ./gradlew --no-daemon setupCiWorkspace build

      - uses: actions/upload-artifact@v4
        with:
          name: jojostands-jar
          path: jojostands/build/libs/*.jar
          if-no-files-found: error
